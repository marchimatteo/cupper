<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CUPPER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container pt-4">
    <div class="card">
        <div class="card-header">
            Estrai CUP da descrizione budget
        </div>
        <div class="card-body pb-0">
            <!--<h5 class="card-title">Special title treatment</h5>
            <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>-->
            <form>
                <div class="row g-3 mb-3 align-items-center">
                    <div class="col-12 col-md-3">
                        <label for="inputCaricaAscot" class="col-form-label">Carica estrazione Ascot</label>
                    </div>
                    <div class="col-12 col-md-9">
                        <div class="input-group">
                            <input type="file" class="form-control" id="inputCaricaAscot" aria-label="Upload">
                        </div>
                    </div>
                </div>
            </form>

            <div class="alert alert-primary" role="alert" id="alertInCorso" hidden>
                Elaborazione del file in corso...
            </div>
            <div class="alert alert-success d-none justify-content-between align-items-center" role="alert" id="alertSuccess">
                <span>Elaborazione completata con successo!</span>
                <button type="button" class="btn btn-success" id="buttonScarica">Scarica</button>
            </div>
            <div class="alert alert-danger" role="alert" id="alertError" hidden>

            </div>

            <div id="status"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<script src="ascot-cup.js"></script>

</script>

</body>
</html>
